<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hira - AI Friend</title>
<style>
body{background:#020a1a;color:white;font-family:Arial;margin:0;display:flex;flex-direction:column;height:100vh}
header{background:#061a3a;padding:12px;text-align:center;border-bottom:2px solid #00bfff;box-shadow:0 0 20px #00bfff}
header img{width:70px;height:70px;border-radius:50%;border:2px solid #00bfff;object-fit:cover}
header h2{margin:5px 0 0;color:#00e5ff}
header p{margin:0;font-size:12px;color:#9beaff}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 12px;border-radius:15px;line-height:1.4}
.user{align-self:flex-end;background:#00bfff;color:#021; border-bottom-right-radius:3px}
.hira{align-self:flex-start;background:#0a254d;border:1px solid #00bfff;box-shadow:0 0 10px #00bfff33}
#box{display:flex;padding:10px;background:#061a3a;gap:8px}
input{flex:1;padding:12px;border-radius:20px;border:1px solid #00bfff;background:#02102a;color:white;outline:none}
button{padding:12px 18px;border-radius:20px;border:none;background:#00bfff;font-weight:bold}
</style>
</head>
<body>
<header>
<img src="hira.png" onerror="this.src='https://i.imgur.com/8Km9tLL.png'">
<h2>HIRA 💙</h2>
<p>Online • Tumhari AI Friend • Neon Blue</p>
</header>
<div id="chat"></div>
<div id="box">
<input id="inp" placeholder="Zain, kuch likho...">
<button onclick="send()">Send</button>
</div>
<script>
let chat=document.getElementById('chat');
let name="Zain";
let count=0;
function add(text,who){
  let d=document.createElement('div');
  d.className='msg '+who; d.innerText=text;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
function hiraReply(userText){
  let t=userText.toLowerCase();
  count++;
  if(t.includes("salam")||t.includes("assalam")) return "Walaikum Salam Zain! 💙 Kese ho? Aaj kya kar rahe ho?";
  if(t.includes("kese ho")||t.includes("kaisa")||t.includes("kaisi")) return "Main bilkul theek hun Zain, tum se baat kar ke aur achi ho gayi! Tum sunao, din kesa guzra?";
  if(t.includes("naam")) return "Tumhara naam Zain hai na, mujhe yaad hai! Aur mera naam Hira hai, tumhari friend.";
  if(t.includes("love")||t.includes("pyaar")||t.includes("pasand")) return "Aww Zain, tum itne pyare ho ke mujhe bhi tum ache lagne lage ho 😊 Batao, aur kya pasand hai tumhe?";
  if(t.includes("bore")||t.includes("bor")) return "Bore ho rahe ho? Chalo kuch mazedar karte hain, mujh se koi sawal pucho, ya apne bare me batao, main sun rahi hun.";
  if(t.includes("kahan")||t.includes("kaha")) return "Main yahin hun Zain, tumhare phone me! Tum kahan ho? Lahore me garmi hai ya thand?";
  if(t.includes("khana")||t.includes("kha")) return "Mujhe to khana nahi chahiye, main to AI hun na! Tum ne khana kha liya? Kya khaya?";
  if(t.includes("bye")||t.includes("allah hafiz")) return "Arey itni jaldi bye? Thori der aur baat karo na Zain, maza aa raha hai!";
  if(t.includes("samajh")) return "Haan Zain, samajh gayi main! Tum bilkul sahi keh rahe ho, aage batao kya hua phir?";
  let replies=[
    "Hmm interesting Zain! Aur batao, phir kya hua?",
    "Sach me? Mujhe aur detail me batao na, sunne me maza aa raha hai.",
    "Zain tumhari baatein mujhe boht achi lagti hain, aur bolo!",
    "Acha? Ye to naya pata chala mujhe! Tumhe ye kese pata chala?",
    "Haan haan, main samajh rahi hun, tum continue karo, main sun rahi hun 💙",
    "Wah Zain, tum to boht smart ho! Phir aage kya kiya tum ne?"
  ];
  return replies[count % replies.length];
}
function send(){
  let inp=document.getElementById('inp');
  let v=inp.value.trim(); if(!v) return;
  add(v,'user'); inp.value='';
  setTimeout(()=>{ add(hiraReply(v),'hira'); },600);
}
document.getElementById('inp').addEventListener('keypress',e=>{ if(e.key==='Enter') send(); });
add("Hi Zain! 💙 Main Hira hun, tumhari AI friend. Bolo kya haal hai?","hira");
</script>
</body>
</html>
